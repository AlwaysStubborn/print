<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>岛上采果 · 随机与规矩</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <main class="shell">
    <header class="top">
      <p class="brand">Island Fruit</p>
      <h1>岛上采果</h1>
      <p class="tagline">天气随机。选择有规矩。结果不一定听话。</p>
    </header>

    <section id="screen-start" class="panel">
      <p class="lead">
        岛上三片果林：稳的、晃的、偶尔暴富的。
        <strong>定好采法再出发</strong>——采法对，也不保证这一局好看。
      </p>

      <div class="field">
        <label for="seed-input">天气编号（填一样的 = 同一串晴雨）</label>
        <div class="row">
          <input id="seed-input" type="text" maxlength="12" autocomplete="off" />
          <button type="button" class="btn ghost" id="btn-random-seed">换一个</button>
        </div>
      </div>

      <fieldset class="strategy-pick">
        <legend>本局怎么采</legend>
        <label class="card-opt">
          <input type="radio" name="strategy" value="steady" />
          <span>
            <strong>全程坚果</strong>
            <em>只采最稳的。少大起大落，也很少第一。</em>
          </span>
        </label>
        <label class="card-opt">
          <input type="radio" name="strategy" value="rules" checked />
          <span>
            <strong>混合规矩</strong>
            <em>平时坚果；甜果只在「熟度够」时采。不追传说果。</em>
          </span>
        </label>
        <label class="card-opt">
          <input type="radio" name="strategy" value="follow" />
          <span>
            <strong>跟岛民</strong>
            <em>听传言、追热闹。可能很多，也可能摔得很疼。</em>
          </span>
        </label>
      </fieldset>

      <button type="button" class="btn primary" id="btn-start">开始 12 天</button>
      <p class="hint">玩完后可用「同一天气 · 换采法」再开一局，对比同一种晴雨下的差别。</p>
    </section>

    <section id="screen-play" class="panel hidden">
      <div class="status-bar">
        <div><span class="k">第几天</span><span id="day-label">1 / 12</span></div>
        <div><span class="k">背包</span><span id="bag-label">100</span></div>
        <div><span class="k">采法</span><span id="strat-label">混合规矩</span></div>
        <div><span class="k">天气编号</span><span id="seed-label">—</span></div>
      </div>

      <div class="weather-block" id="weather-block">
        <div class="weather-icon" id="weather-icon">☁</div>
        <div>
          <p class="weather-name" id="weather-name">阴天</p>
          <p class="weather-desc" id="weather-desc">产量普通。</p>
        </div>
      </div>

      <div id="plan-box" class="plan-box">
        <p class="plan-title">今天打算</p>
        <p id="plan-text">—</p>
        <p id="ripe-text" class="ripe-text"></p>
      </div>

      <div class="plots" id="plots"></div>

      <div id="event-box" class="event-box hidden"></div>
      <div id="rumor-box" class="rumor-box hidden"></div>

      <div class="actions">
        <button type="button" class="btn primary" id="btn-next">确认采摘</button>
        <button type="button" class="btn ghost" id="btn-obey" disabled>听传言</button>
        <button type="button" class="btn ghost" id="btn-ignore" disabled>不听</button>
      </div>

      <ol class="log" id="log"></ol>
    </section>

    <section id="screen-end" class="panel hidden">
      <h2>今天收工</h2>
      <div class="scores">
        <div class="score-card">
          <p class="k">结果（果子）</p>
          <p class="big" id="result-score">—</p>
          <p class="sub" id="result-note">期末果子</p>
        </div>
        <div class="score-card">
          <p class="k">过程（守规矩）</p>
          <p class="big" id="process-score">—</p>
          <p class="sub" id="process-note">有没有守规矩</p>
        </div>
      </div>
      <p class="verdict" id="verdict"></p>
      <div id="compare-box" class="compare-box"></div>
      <ul class="stats" id="end-stats"></ul>
      <div class="actions end-actions">
        <button type="button" class="btn primary" id="btn-replay-same">同一天气 · 换采法</button>
        <button type="button" class="btn ghost" id="btn-new-seed">换天气 · 再来</button>
      </div>
      <p class="hint">果子多不等于采法更稳。同一串晴雨，换一种采法再比一次最清楚。</p>
    </section>
  </main>

  <script src="./game.js"></script>
</body>
</html>
